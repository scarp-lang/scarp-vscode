      - name: Exercise real untrusted VS Code Extension Host
        run: xvfb-run -a npm run test:untrusted
      - name: Package after editor download and reject any bundled VS Code test binaries
        shell: bash
        run: |
          set -euo pipefail
          npm run package:pre
          version="$(node -p "require('./package.json').version")"
          bash scripts/verify-vsix.sh "scarp-$version.vsix" "$version"
