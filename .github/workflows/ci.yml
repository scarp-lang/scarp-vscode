name: Extension verification

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded commits within each event type, but never cancel a PR
# check with a push check for the same SHA (required checks must stay green).
concurrency:
  group: scarp-vscode-ci-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - name: Package pre-release VSIX
        run: npm run package:pre
      - name: Check VSIX excludes internal repository metadata
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          vsix="scarp-$(node -p "require('./package.json').version").vsix"
          test -f "$vsix"
          unzip -Z1 "$vsix" | grep -Fx 'extension/syntaxes/scarp.tmLanguage.json'
          unzip -Z1 "$vsix" | grep -Fx 'extension/dist/src/extension.js'
          unzip -Z1 "$vsix" | grep -Fx 'extension/language-configuration.json'
          if unzip -Z1 "$vsix" | grep -E '^extension/(release-requests|compiler|test|\.github|\.vscode|site|docs|src|scripts|node_modules)/|\.(ts|map)$|^extension/package-lock\.json$'; then
            echo "Refusing VSIX containing internal source, test or workflow files." >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: scarp-vscode-0.1.4-dev-vsix
          path: "*.vsix"
          if-no-files-found: error

  compiler-smoke:
    name: Pinned official Scarp CLI smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: scarp-lang/scarp
          ref: v0.0.5-alpha.5
          path: compiler
      - name: Build official pinned compiler
        run: cargo build --locked --release --manifest-path compiler/Cargo.toml
      - name: Check and run a real Scarp program
        shell: bash
        run: |
          compiler/target/release/scarp --version
          compiler/target/release/scarp verify test/fixtures/hello.srp
          compiler/target/release/scarp guide exec
          output="$(compiler/target/release/scarp exec test/fixtures/hello.srp)"
          test "$output" = "Hello from Scarp!"
          project_parent="$(mktemp -d)"
          trap 'rm -rf "$project_parent"' EXIT
          compiler/target/release/scarp create -- "$project_parent/my project"
          compiler/target/release/scarp verify --diagnostic-format=json -- "$project_parent/my project"
          compiler/target/release/scarp inspect modules --json -- "$project_parent/my project" |
            node -e '
              const fs = require("node:fs");
              const graph = JSON.parse(fs.readFileSync(0, "utf8"));
              if (graph.schema_version !== 1 || !Array.isArray(graph.modules) ||
                  graph.modules.length < 1) {
                throw new Error("Scarp alpha.5 did not return a valid project module inventory.");
              }
            '
          project_output="$(compiler/target/release/scarp launch -- "$project_parent/my project")"
          test "$project_output" = "Hello from Scarp!"

  editor-integration:
    name: VS Code Extension Host (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: scarp-lang/scarp
          ref: v0.0.5-alpha.5
          path: compiler
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Build pinned Scarp compiler
        run: cargo build --locked --release --manifest-path compiler/Cargo.toml
      - name: Exercise VS Code Extension Host with official compiler
        env:
          SCARP_TEST_BINARY: ${{ github.workspace }}/compiler/target/release/scarp
        run: xvfb-run -a npm run test:integration
