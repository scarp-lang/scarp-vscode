name: Extension verification

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded commits within each event type, but never cancel a PR
# check with a push check for the same SHA (required checks must stay green).
concurrency:
  group: scarp-vscode-ci-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - name: Package pre-release VSIX
        run: npm run package:pre
      - name: Validate experimental VSIX contents and marker
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          bash scripts/verify-vsix.sh "scarp-$version.vsix" "$version"

      - name: Prove pre-release asset comparison rejects changed bytes
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          vsix="scarp-$version.vsix"
          bash scripts/compare-vsix.sh "$vsix" "$vsix"
          tampered="$(mktemp "${RUNNER_TEMP}/scarp-tampered-XXXXXX.vsix")"
          trap 'rm -f "$tampered"' EXIT
          # Check both ordinary package metadata and mandatory XML metadata.
          # [Content_Types].xml exposed an unzip glob comparison blind spot.
          for member in 'extension/package.json' '[Content_Types].xml'; do
            TAMPER_MEMBER="$member" python3 - "$vsix" "$tampered" <<'PY'
          import os
          import sys
          import zipfile

          with zipfile.ZipFile(sys.argv[1]) as verified, zipfile.ZipFile(sys.argv[2], 'w') as altered:
              for entry in verified.infolist():
                  payload = verified.read(entry.filename)
                  if entry.filename == os.environ['TAMPER_MEMBER']:
                      payload += b' '
                  altered.writestr(entry.filename, payload, compress_type=entry.compress_type)
          PY
            if bash scripts/compare-vsix.sh "$vsix" "$tampered"; then
              echo "Unsafe VSIX comparison accepted altered member: $member" >&2
              exit 1
            fi
          done

          # Duplicate names are ambiguous to ZIP consumers: fail closed.
          python3 - "$vsix" "$tampered" <<'PY'
          import sys
          import zipfile

          with zipfile.ZipFile(sys.argv[1]) as verified, zipfile.ZipFile(sys.argv[2], 'w') as altered:
              for entry in verified.infolist():
                  altered.writestr(entry.filename, verified.read(entry.filename), compress_type=entry.compress_type)
              altered.writestr('[Content_Types].xml', verified.read('[Content_Types].xml'))
          PY
          if bash scripts/compare-vsix.sh "$vsix" "$tampered"; then
            echo "Unsafe VSIX comparison accepted a duplicate ZIP member." >&2
            exit 1
          fi
          if bash scripts/verify-vsix.sh "$tampered" "$version"; then
            echo "Unsafe first-upload validator accepted a duplicate ZIP member." >&2
            exit 1
          fi

          # A well-formed archive with otherwise correct package contents
          # must not smuggle traversal paths into a new GitHub release.
          python3 - "$vsix" "$tampered" <<'PY'
          import sys
          import zipfile

          with zipfile.ZipFile(sys.argv[1]) as verified, zipfile.ZipFile(sys.argv[2], 'w') as altered:
              for entry in verified.infolist():
                  altered.writestr(entry.filename, verified.read(entry.filename), compress_type=entry.compress_type)
              altered.writestr('../outside.srp', 'print("unsafe");')
          PY
          if bash scripts/verify-vsix.sh "$tampered" "$version"; then
            echo "Unsafe first-upload validator accepted a traversal ZIP path." >&2
            exit 1
          fi

          # Reject symlinks in ZIP metadata regardless of their destination.
          python3 - "$vsix" "$tampered" <<'PY'
          import stat
          import sys
          import zipfile

          with zipfile.ZipFile(sys.argv[1]) as verified, zipfile.ZipFile(sys.argv[2], 'w') as altered:
              for entry in verified.infolist():
                  altered.writestr(entry.filename, verified.read(entry.filename), compress_type=entry.compress_type)
              link = zipfile.ZipInfo('extension/linked-source.srp')
              link.create_system = 3
              link.external_attr = (stat.S_IFLNK | 0o777) << 16
              altered.writestr(link, 'source.srp')
          PY
          if bash scripts/verify-vsix.sh "$tampered" "$version"; then
            echo "Unsafe first-upload validator accepted a symlink ZIP member." >&2
            exit 1
          fi

          # Missing mandatory ZIP-level metadata must fail even if the
          # extension itself contains the expected manifest and entrypoint.
          python3 - "$vsix" "$tampered" <<'PY'
          import sys
          import zipfile

          with zipfile.ZipFile(sys.argv[1]) as verified, zipfile.ZipFile(sys.argv[2], 'w') as altered:
              for entry in verified.infolist():
                  if entry.filename != '[Content_Types].xml':
                      altered.writestr(entry.filename, verified.read(entry.filename), compress_type=entry.compress_type)
          PY
          if bash scripts/verify-vsix.sh "$tampered" "$version"; then
            echo "Unsafe first-upload validator accepted missing VSIX metadata." >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: scarp-vscode-0.1.5-dev-vsix
          path: "*.vsix"
          if-no-files-found: error

  compiler-smoke:
    name: Pinned official Scarp CLI smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: scarp-lang/scarp
          ref: v0.0.6-alpha.1
          path: compiler
      - name: Build official pinned compiler
        run: cargo build --locked --release --manifest-path compiler/Cargo.toml
      - name: Check and run a real Scarp program
        shell: bash
        run: |
          compiler/target/release/scarp --version
          compiler/target/release/scarp verify test/fixtures/hello.srp
          compiler/target/release/scarp guide exec
          output="$(compiler/target/release/scarp exec test/fixtures/hello.srp)"
          test "$output" = "Hello from Scarp!"
          project_parent="$(mktemp -d)"
          trap 'rm -rf "$project_parent"' EXIT
          compiler/target/release/scarp create -- "$project_parent/my project"
          compiler/target/release/scarp verify --diagnostic-format=json -- "$project_parent/my project"
          compiler/target/release/scarp inspect modules --json -- "$project_parent/my project" |
            node -e '
              const fs = require("node:fs");
              const graph = JSON.parse(fs.readFileSync(0, "utf8"));
              if (graph.schema_version !== 1 || !Array.isArray(graph.modules) ||
                  graph.modules.length < 1) {
                throw new Error("Scarp v0.0.6-alpha.1 did not return a valid project module inventory.");
              }
            '
          # New static symbol/references schema-v1 from published 0.0.6-alpha.1.
          compiler/target/release/scarp inspect references --json -- "$project_parent/my project" |
            node -e '
              const fs = require("node:fs");
              const graph = JSON.parse(fs.readFileSync(0, "utf8"));
              if (graph.schema_version !== 1 || graph.kind !== "scarp.references" ||
                  !Array.isArray(graph.files) || !Array.isArray(graph.symbols) ||
                  !Array.isArray(graph.references)) {
                throw new Error("Scarp source navigation schema is incompatible.");
              }
            '
          project_output="$(compiler/target/release/scarp launch -- "$project_parent/my project")"
          test "$project_output" = "Hello from Scarp!"

  editor-integration:
    name: VS Code Extension Host (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: scarp-lang/scarp
          ref: v0.0.6-alpha.1
          path: compiler
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Build pinned Scarp compiler
        run: cargo build --locked --release --manifest-path compiler/Cargo.toml
      - name: Exercise VS Code Extension Host with official compiler
        env:
          SCARP_TEST_BINARY: ${{ github.workspace }}/compiler/target/release/scarp
        run: xvfb-run -a npm run test:integration

  compiler-alpha2-compatibility:
    name: Official Scarp alpha.2 compatibility (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Test the actual published compiler, never unreleased compiler main.
      # Retain alpha.1 smoke and Editor Host jobs above as the minimum supported
      # navigation/CLI baseline. Each additional published prerelease is a separate gate.
      - uses: actions/checkout@v4
        with:
          repository: scarp-lang/scarp
          ref: v0.0.6-alpha.2
          path: compiler
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Build and smoke-test official Scarp v0.0.6-alpha.2 CLI
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release --manifest-path compiler/Cargo.toml
          compiler/target/release/scarp --version | grep -F '0.0.6-alpha.2'
          compiler/target/release/scarp verify test/fixtures/hello.srp
          compiler/target/release/scarp guide exec
          output="$(compiler/target/release/scarp exec test/fixtures/hello.srp)"
          test "$output" = "Hello from Scarp!"
          project_parent="$(mktemp -d)"
          trap 'rm -rf "$project_parent"' EXIT
          compiler/target/release/scarp create -- "$project_parent/my project"
          compiler/target/release/scarp verify --diagnostic-format=json -- "$project_parent/my project"
          compiler/target/release/scarp inspect modules --json -- "$project_parent/my project" |
            node -e '
              const fs = require("node:fs");
              const graph = JSON.parse(fs.readFileSync(0, "utf8"));
              if (graph.schema_version !== 1 || !Array.isArray(graph.modules) ||
                  graph.modules.length < 1) {
                throw new Error("Scarp alpha.2 project module schema is incompatible.");
              }
            '
          compiler/target/release/scarp inspect references --json -- "$project_parent/my project" |
            node -e '
              const fs = require("node:fs");
              const graph = JSON.parse(fs.readFileSync(0, "utf8"));
              if (graph.schema_version !== 1 || graph.kind !== "scarp.references" ||
                  !Array.isArray(graph.files) || !Array.isArray(graph.symbols) ||
                  !Array.isArray(graph.references)) {
                throw new Error("Scarp alpha.2 source reference schema is incompatible.");
              }
            '
          output="$(compiler/target/release/scarp launch -- "$project_parent/my project")"
          test "$output" = "Hello from Scarp!"
      - name: Exercise actual VS Code Extension Host with Scarp alpha.2
        env:
          SCARP_TEST_BINARY: ${{ github.workspace }}/compiler/target/release/scarp
        run: xvfb-run -a npm run test:integration

  compiler-alpha3-compatibility:
