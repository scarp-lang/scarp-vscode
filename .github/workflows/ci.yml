  compiler-alpha5-compatibility:
    name: Official Scarp alpha.5 compatibility (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Test the actual published compiler, never unreleased compiler main.
      # Retain alpha.1 smoke and Editor Host jobs above as the minimum supported
      # navigation/CLI baseline. Each additional published prerelease is a separate gate.
      - uses: actions/checkout@v4
        with:
          repository: scarp-lang/scarp
          ref: v0.0.6-alpha.5
          path: compiler
      - uses: actions/setup-node@v4
        with:
