                throw new Error("Scarp alpha.3 project module schema is incompatible.");
              }
            '
          compiler/target/release/scarp inspect references --json -- "$project_parent/my project" |
            node -e '
              const fs = require("node:fs");
              const graph = JSON.parse(fs.readFileSync(0, "utf8"));
              if (graph.schema_version !== 1 || graph.kind !== "scarp.references" ||
                  !Array.isArray(graph.files) || !Array.isArray(graph.symbols) ||
                  !Array.isArray(graph.references)) {
