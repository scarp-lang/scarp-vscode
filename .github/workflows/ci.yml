  compiler-alpha13-alpha14-windows:
    name: Published Scarp alpha.${{ matrix.alpha }} Windows CLI and VS Code Host
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - alpha: "13"
            tag: v0.0.6-alpha.13
            commit: e755fda37cdaeed29434e848cb5dd41f2f2e7eb2
          - alpha: "14"
            tag: v0.0.6-alpha.14
            commit: 43627b74af5fccccc5e233e98207413983ebafc1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: scarp-lang/scarp
          ref: ${{ matrix.tag }}
          path: compiler
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - name: Build exact published compiler for Windows and test source contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedSha = '${{ matrix.commit }}'
          $actualSha = (git -C compiler rev-parse HEAD).Trim()
          if ($actualSha -ne $expectedSha) { throw "Published compiler source mismatch" }
          cargo build --locked --release --manifest-path compiler/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Scarp compiler build failed' }
          $binary = Join-Path $PWD 'compiler/target/release/scarp.exe'
          $version = & $binary --version
          if ($LASTEXITCODE -ne 0 -or $version -notlike '*0.0.6-alpha.${{ matrix.alpha }}*') {
            throw "Incorrect Windows Scarp compiler version: $version"
          }
          $examples = @('typed_submission', 'typed_propagation',
                        'variant_validation', 'typed_maps', 'typed_dynamic_lists')
          if ('${{ matrix.alpha }}' -eq '14') {
            $examples += @('structured_pattern_coverage', 'map_projection_snapshots',
                           'map_string_projection_snapshots', 'native_scalar_repeat')
          }
          foreach ($example in $examples) {
            & $binary verify "compiler/examples/$example.srp"
            if ($LASTEXITCODE -ne 0) { throw "Static verification failed: $example" }
            $actual = (& $binary exec "compiler/examples/$example.srp" | Out-String).TrimEnd()
            if ($LASTEXITCODE -ne 0) { throw "Interpreter execution failed: $example" }
            $expected = (Get-Content -Raw "compiler/examples/$example.stdout").TrimEnd()
            if ($actual.Replace("`r`n", "`n") -ne $expected.Replace("`r`n", "`n")) {
              throw "Windows interpreter output mismatch: $example"
            }
          }
          # Validate real Windows compiler JSON and verbatim path handling
          # before the VS Code Extension Host exercises its module browser.
          node scripts/verify-module-inventory.cjs "$binary" compiler/examples/app_state.srp 4
          if ($LASTEXITCODE -ne 0) { throw 'Windows schema v4 module inspection failed' }
          node scripts/verify-module-inventory.cjs "$binary" compiler/examples/variant_validation.srp 5
          if ($LASTEXITCODE -ne 0) { throw 'Windows schema v5 module inspection failed' }
          & $binary verify compiler/examples/projects/task-board
          if ($LASTEXITCODE -ne 0) { throw 'Task-board project verification failed' }
          & $binary test --require-tests compiler/examples/projects/task-board
          if ($LASTEXITCODE -ne 0) { throw 'Task-board project tests failed' }
      - name: Exercise real Windows VS Code Extension Host with published alpha.${{ matrix.alpha }}
        env:
          SCARP_TEST_BINARY: ${{ github.workspace }}\compiler\target\release\scarp.exe
          SCARP_TEST_SUITE: windows
        run: npm run test:integration

  compiler-alpha14-compatibility:
    name: Official Scarp alpha.14 CLI and editor (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: scarp-lang/scarp
          ref: v0.0.6-alpha.14
          path: compiler
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - name: Verify pinned published compiler and editor-facing alpha.14 contracts
        shell: bash
        run: |
          set -euo pipefail
          # Do not substitute the moving compiler main branch for the approved release.
          test "$(git -C compiler rev-parse HEAD)" = "43627b74af5fccccc5e233e98207413983ebafc1"
          cargo build --locked --release --manifest-path compiler/Cargo.toml
          binary="$PWD/compiler/target/release/scarp"
          "$binary" --version | grep -F '0.0.6-alpha.14'
          # Test actual nested destructuring and persistent map snapshots against
          # published, byte-exact interpreter outputs (not invented editor syntax).
          for example in structured_pattern_coverage map_projection_snapshots \
              map_string_projection_snapshots native_scalar_repeat; do
            "$binary" verify "compiler/examples/$example.srp"
            "$binary" exec "compiler/examples/$example.srp" > "$RUNNER_TEMP/$example.actual"
            cmp "compiler/examples/$example.stdout" "$RUNNER_TEMP/$example.actual"
          done
          # Ensure a malformed nested group is rejected by static verification;
          # the extension must not attempt to repair source or execute it.
          malformed="$(mktemp "$RUNNER_TEMP/scarp-nested-XXXXXX.srp")"
          trap 'rm -f "$malformed"' EXIT
          printf 'bind (left, (middle, right) = (1, (2, 3));\n' > "$malformed"
          if "$binary" verify --diagnostic-format=json -- "$malformed" \
              > "$RUNNER_TEMP/nested.stdout" 2> "$RUNNER_TEMP/nested.stderr"; then
            echo 'Malformed nested destructuring unexpectedly verified.' >&2
            exit 1
          fi
          # Assert the genuine compiler's structured source location survives
          # translation to the VS Code extension's diagnostic parser.
          test ! -s "$RUNNER_TEMP/nested.stdout"
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const { parseDiagnostics } = require("./dist/src/diagnostics.js");
            const output = fs.readFileSync(process.argv[1], "utf8");
            const source = path.resolve(process.argv[2]);
            const errors = parseDiagnostics(output);
            if (!errors.some(error => error.severity === "error" &&
                path.resolve(error.filename) === source && error.line === 1 &&
                Number.isSafeInteger(error.column) && error.column >= 1)) {
              throw Error("Alpha.14 nested diagnostic is not a source-located schema-v1 error: " +
                output);
            }
          ' "$RUNNER_TEMP/nested.stderr" "$malformed"
          # Schema v4/v5 and workspace containment must still agree with the
          # latest compiler's real JSON, not only synthetic unit fixtures.
          node scripts/verify-module-inventory.cjs "$binary" compiler/examples/app_state.srp 4
          node scripts/verify-module-inventory.cjs "$binary" compiler/examples/variant_validation.srp 5
          node scripts/verify-snippets.cjs "$binary" 14
          # Index source from the published compiler, rather than an invented
          # editor fixture. This only reads source and never executes a snippet.
          node - <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const { scanScarpSymbols } = require('./dist/src/documentSymbols.js');
          const source = fs.readFileSync('compiler/examples/data_destructure.srp', 'utf8');
          const names = scanScarpSymbols(source).map(item => item.name);
          for (const name of [
            'make_pair', 'result', 'state', 'first', 'second', 'third',
            'answer', 'quantity', 'unit_price', 'spare_price', 'currency'
          ]) {
            assert.ok(names.includes(name), 'Missing published pattern binding: ' + name);
          }
          assert.ok(!names.includes('_'), 'Discard must never appear in Outline');
          assert.ok(!names.includes('note'), 'Function-local bindings are not file symbols');
          NODE
          "$binary" verify compiler/examples/projects/task-board
          "$binary" test --require-tests compiler/examples/projects/task-board
      - name: Exercise actual VS Code Extension Host with published alpha.14
        env:
          SCARP_TEST_BINARY: ${{ github.workspace }}/compiler/target/release/scarp
        run: xvfb-run -a npm run test:integration

  compiler-alpha15-compatibility:
    name: Official Scarp alpha.15 CLI and editor (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: scarp-lang/scarp
          ref: v0.0.6-alpha.15
          path: compiler
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - name: Check exact published alpha.15 frontend limits and editor protocol
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "a21b7b6d942bd1ca9abbbbb522f92f9c8e21e281"
          cargo build --locked --release --manifest-path compiler/Cargo.toml
          binary="$PWD/compiler/target/release/scarp"
          "$binary" --version | grep -F '0.0.6-alpha.15'
          for example in structured_pattern_coverage map_projection_snapshots \
              map_string_projection_snapshots; do
            "$binary" verify "compiler/examples/$example.srp"
            "$binary" exec "compiler/examples/$example.srp" > "$RUNNER_TEMP/$example.actual"
            cmp "compiler/examples/$example.stdout" "$RUNNER_TEMP/$example.actual"
          done
          # Alpha.15 limits token and AST inspection to 1 MiB UTF-8 per file.
          # Exercise the exact byte boundary, with no runtime execution.
          python3 - "$RUNNER_TEMP" <<'PY'
          from pathlib import Path
          import sys
          root = Path(sys.argv[1])
          prefix = b'print("ok");\n'
          limit = 1024 * 1024
          root.joinpath('alpha15-boundary.srp').write_bytes(
              prefix + b' ' * (limit - len(prefix)))
          root.joinpath('alpha15-oversized.srp').write_bytes(
              prefix + b' ' * (limit + 1 - len(prefix)))
          PY
          for inspection in tokens ast; do
            "$binary" inspect "$inspection" -- "$RUNNER_TEMP/alpha15-boundary.srp" > /dev/null
            if "$binary" inspect "$inspection" -- "$RUNNER_TEMP/alpha15-oversized.srp" \
                > "$RUNNER_TEMP/$inspection.stdout" \
                2> "$RUNNER_TEMP/$inspection.stderr"; then
              echo "Oversized source unexpectedly accepted by inspect $inspection" >&2
              exit 1
            fi
            test ! -s "$RUNNER_TEMP/$inspection.stdout"
            test -s "$RUNNER_TEMP/$inspection.stderr"
          done
          # Keep schema-v1 navigation and module v4/v5 decoding compatible.
          "$binary" inspect references --json -- "$PWD/compiler/examples/symbol_navigation.srp" \
            > "$RUNNER_TEMP/alpha15-references.json"
          node - "$RUNNER_TEMP/alpha15-references.json" <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const { parseNavigationIndex } = require('./dist/src/navigationIndex.js');
          const root = fs.realpathSync('compiler/examples');
          const parsed = parseNavigationIndex(
            fs.readFileSync(process.argv[2], 'utf8'), root);
          assert.ok(parsed.files.length > 0);
          assert.ok(parsed.symbols.length > 0);
          assert.ok(parsed.references.length > 0);
          NODE
          node scripts/verify-module-inventory.cjs "$binary" compiler/examples/app_state.srp 4
          node scripts/verify-module-inventory.cjs "$binary" compiler/examples/variant_validation.srp 5
          node scripts/verify-snippets.cjs "$binary" 15
          "$binary" verify compiler/examples/projects/task-board
          "$binary" test --require-tests compiler/examples/projects/task-board
      - name: Exercise actual VS Code Extension Host with published alpha.15
        env:
          SCARP_TEST_BINARY: ${{ github.workspace }}/compiler/target/release/scarp
        run: xvfb-run -a npm run test:integration


