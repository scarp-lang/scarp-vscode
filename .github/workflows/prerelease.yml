name: Publish experimental pre-release

on:
  workflow_dispatch:
    inputs:
      publish_marketplace:
        description: "Also publish to Visual Studio Marketplace as pre-release (requires VS_MARKETPLACE_PAT)"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: scarp-lang/scarp
          ref: v0.0.5-alpha.2
          path: compiler
      - name: Smoke-test pinned official compiler
        shell: bash
        run: |
          cargo build --locked --release --manifest-path compiler/Cargo.toml
          compiler/target/release/scarp check test/fixtures/hello.srp
          output="$(compiler/target/release/scarp run test/fixtures/hello.srp)"
          test "$output" = "Hello from Scarp!"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run package:pre
      - name: Create GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.0 scarp-0.1.0.vsix \
            --target "$GITHUB_SHA" \
            --title "Scarp Compiler & Runner v0.1.0 (pre-release)" \
            --notes "Experimental Scarp compiler integration. Run and check supported; native compile/build are not supported by this compiler version." \
            --prerelease
      - name: Optional Marketplace pre-release
        if: inputs.publish_marketplace
        env:
          VSCE_PAT: ${{ secrets.VS_MARKETPLACE_PAT }}
        run: |
          test -n "$VSCE_PAT" || { echo "VS_MARKETPLACE_PAT secret is missing"; exit 1; }
          npx vsce publish --pre-release --no-dependencies -p "$VSCE_PAT"
