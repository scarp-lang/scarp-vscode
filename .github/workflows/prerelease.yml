name: Publish experimental pre-release

# Publishing a GitHub pre-release is the approval gate. Routine pushes cannot publish.
# workflow_dispatch retains optional, explicitly approved manual publishing.
on:
  workflow_dispatch:
    inputs:
      publish_github:
        description: "Create a public GitHub experimental pre-release; false is qualification-only"
        required: true
        type: boolean
        default: false
      publish_marketplace:
        description: "Also publish to Visual Studio Marketplace (OIDC)"
        required: true
        type: boolean
        default: false
      publish_openvsx:
        description: "Also publish to Open VSX (OVSX_PAT secret)"
        required: true
        type: boolean
        default: false
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

concurrency:
  group: scarp-vscode-registry-publishing
  cancel-in-progress: false

jobs:
  publish:
    # NEVER publish for a stable release, a normal push or a non-main manual run.
    if: >-
      (github.event_name == 'release' && github.event.release.prerelease == true) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      # A published GitHub pre-release must package its approved tag,
      # not the latest commit on main. Manual dispatch is main-only.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}
          fetch-depth: 0

      - name: Require approved GitHub release commit to be on protected main
        if: github.event_name == 'release'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Refusing release: tag commit is not reachable from protected main." >&2
            exit 1
          fi

      - name: Require explicit GitHub release opt-in before registry publishing
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          PUBLISH_GITHUB: ${{ inputs.publish_github }}
          PUBLISH_MARKETPLACE: ${{ inputs.publish_marketplace }}
          PUBLISH_OPENVSX: ${{ inputs.publish_openvsx }}
        run: |
          set -euo pipefail
          if [[ "$PUBLISH_GITHUB" != "true" && ( "$PUBLISH_MARKETPLACE" == "true" || "$PUBLISH_OPENVSX" == "true" ) ]]; then
            echo "Registry publishing requires explicitly enabling publish_github too." >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          repository: scarp-lang/scarp
          ref: v0.0.6-alpha.3
          path: compiler

      - name: Smoke-test pinned official compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release --manifest-path compiler/Cargo.toml
          # Prove this release gate uses the current published prerelease,
          # not an unreviewed compiler-main checkout or an older CLI.
          compiler/target/release/scarp --version | grep -F '0.0.6-alpha.3'
          compiler/target/release/scarp verify test/fixtures/hello.srp
          compiler/target/release/scarp guide exec
          output="$(compiler/target/release/scarp exec test/fixtures/hello.srp)"
          test "$output" = "Hello from Scarp!"
          project_parent="$(mktemp -d)"
          trap 'rm -rf "$project_parent"' EXIT
          compiler/target/release/scarp create -- "$project_parent/my project"
          compiler/target/release/scarp verify --diagnostic-format=json -- "$project_parent/my project"
          compiler/target/release/scarp inspect modules --json -- "$project_parent/my project" |
            node -e '
              const fs = require("node:fs");
              const graph = JSON.parse(fs.readFileSync(0, "utf8"));
              if (graph.schema_version !== 1 || !Array.isArray(graph.modules) ||
                  graph.modules.length < 1) {
                throw new Error("Scarp v0.0.6-alpha.3 project inspection failed.");
              }
            '
          compiler/target/release/scarp inspect references --json -- "$project_parent/my project" |
            node -e '
              const fs = require("node:fs");
              const graph = JSON.parse(fs.readFileSync(0, "utf8"));
              if (graph.schema_version !== 1 || graph.kind !== "scarp.references" ||
                  !Array.isArray(graph.files) || !Array.isArray(graph.symbols) ||
                  !Array.isArray(graph.references)) {
                throw new Error("Scarp navigation schema is incompatible.");
              }
            '
          project_output="$(compiler/target/release/scarp launch -- "$project_parent/my project")"
          test "$project_output" = "Hello from Scarp!"
          # Check new alpha.3 numerical built-ins before any upload.
          for example in topk_scores temperature_softmax; do
            compiler/target/release/scarp verify "compiler/examples/$example.srp"
            compiler/target/release/scarp exec "compiler/examples/$example.srp" > "$RUNNER_TEMP/$example.actual"
            diff -u "compiler/examples/$example.stdout" "$RUNNER_TEMP/$example.actual"
          done

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install --no-audit --no-fund
      - run: npm run check

      # The release workflow must independently execute actual editor-host tests
      # on the checked-out approved tag or the exact manually dispatched main SHA.
      # Do not rely solely on a previous PR check or a build/package result.
      - name: Gate release on trusted VS Code Extension Host integration
        env:
          SCARP_TEST_BINARY: ${{ github.workspace }}/compiler/target/release/scarp
        run: xvfb-run -a npm run test:integration

      - name: Gate release on real untrusted VS Code Restricted Mode
        run: xvfb-run -a npm run test:untrusted

      - name: Validate version and release tag
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUBLISHED_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VS Code extensions require numeric major.minor.patch versions." >&2
            exit 1
          fi
          tag="v$version"
          if [[ "$EVENT_NAME" == "release" && "$PUBLISHED_TAG" != "$tag" ]]; then
            echo "Refusing to publish: GitHub release tag $PUBLISHED_TAG does not match package version $tag." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "vsix=scarp-$version.vsix" >> "$GITHUB_OUTPUT"

      - name: Reject manual publication against an unrelated existing release tag
        if: github.event_name == 'workflow_dispatch' && inputs.publish_github
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          # Checkout has full history; refresh tags before testing their
          # resolved commits. Matching files are not enough for provenance.
          git fetch --tags origin
          node scripts/assert-tag-provenance.cjs "$TAG"

      - name: Build verified pre-release package
        run: npm run package:pre

      - name: Verify release-ready VSIX before any GitHub upload
        shell: bash
        env:
          VSIX: ${{ steps.release.outputs.vsix }}
          VERSION: ${{ steps.release.outputs.version }}
        run: bash scripts/verify-vsix.sh "$VSIX" "$VERSION"

      - name: Upload qualified pre-release VSIX to this Actions run (no publication)
        if: github.event_name == 'workflow_dispatch' && !inputs.publish_github
        uses: actions/upload-artifact@v4
        with:
          name: scarp-vscode-${{ steps.release.outputs.version }}-qualified-vsix
          path: ${{ steps.release.outputs.vsix }}
          if-no-files-found: error
          retention-days: 7

      - name: Ensure approved GitHub pre-release has the VSIX
        if: github.event_name == 'release' || inputs.publish_github
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          TAG: ${{ steps.release.outputs.tag }}
          VSIX: ${{ steps.release.outputs.vsix }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if gh release view "$TAG" >/dev/null 2>&1; then
              if [[ "$(gh release view "$TAG" --json isPrerelease --jq '.isPrerelease')" != "true" ]]; then
                echo "Existing GitHub release $TAG is stable. Refusing to publish." >&2
                exit 1
              fi
            else
              notes=(--notes "Experimental Scarp compiler integration; native builds remain unsupported.")
              if [[ -f "docs/releases/$TAG.md" ]]; then
                notes=(--notes-file "docs/releases/$TAG.md")
              fi
              gh release create "$TAG" "$VSIX" \
                --target "$GITHUB_SHA" \
                --title "Scarp Compiler & Runner $TAG (pre-release)" \
                "${notes[@]}" \
                --prerelease
            fi
          fi

          # Use the exact asset attached to GitHub Release for both registries.
          if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fqx "$VSIX"; then
            mkdir -p release-package
            gh release download "$TAG" --pattern "$VSIX" --dir release-package
            # Never publish a pre-attached asset unless its uncompressed bytes
            # exactly match the verified VSIX rebuilt from the reviewed tag.
            bash scripts/compare-vsix.sh "$VSIX" "release-package/$VSIX"
            cp "release-package/$VSIX" "$VSIX"
          else
            gh release upload "$TAG" "$VSIX"
          fi

      - name: Reverify released VSIX after any GitHub download
        if: github.event_name == 'release' || inputs.publish_github
        shell: bash
        env:
          VSIX: ${{ steps.release.outputs.vsix }}
          VERSION: ${{ steps.release.outputs.version }}
        run: bash scripts/verify-vsix.sh "$VSIX" "$VERSION"

      - name: Verify Open VSX secret exists before publishing
        if: github.event_name == 'release' || inputs.publish_openvsx
        shell: bash
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [[ -z "${OVSX_PAT:-}" ]]; then
            echo "Add OVSX_PAT in Settings > Secrets and variables > Actions before publishing." >&2
            exit 1
          fi

      - name: Publish Visual Studio Marketplace pre-release (Trusted Publishing)
        if: github.event_name == 'release' || inputs.publish_marketplace
        env:
          VSIX: ${{ steps.release.outputs.vsix }}
        run: npx vsce publish --pre-release --packagePath "$VSIX" --oidc

      - name: Publish Open VSX pre-release (scoped token)
        if: github.event_name == 'release' || inputs.publish_openvsx
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          VSIX: ${{ steps.release.outputs.vsix }}
        run: npx --yes ovsx@1.3.0 publish "$VSIX"
