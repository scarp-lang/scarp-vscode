name: Publish experimental pre-release

# Publishing a GitHub pre-release is the approval gate. Routine pushes cannot publish.
# workflow_dispatch retains optional, explicitly approved manual publishing.
on:
  workflow_dispatch:
    inputs:
      publish_marketplace:
        description: "Also publish to Visual Studio Marketplace (OIDC)"
        required: true
        type: boolean
        default: false
      publish_openvsx:
        description: "Also publish to Open VSX (OVSX_PAT secret)"
        required: true
        type: boolean
        default: false
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

concurrency:
  group: scarp-vscode-registry-publishing
  cancel-in-progress: false

jobs:
  publish:
    # NEVER publish for a stable release, a normal push or a non-main manual run.
    if: >-
      (github.event_name == 'release' && github.event.release.prerelease == true) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      # Check out the approved GitHub release tag, never a newer main commit.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}
          fetch-depth: 0

      - name: Require published release commit to be reachable from main
        if: github.event_name == 'release'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Refusing release: tag commit is not on protected main." >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          repository: scarp-lang/scarp
          ref: v0.0.5-alpha.5
          path: compiler

      - name: Smoke-test pinned official compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release --manifest-path compiler/Cargo.toml
          compiler/target/release/scarp verify test/fixtures/hello.srp
          compiler/target/release/scarp guide exec
          output="$(compiler/target/release/scarp exec test/fixtures/hello.srp)"
          test "$output" = "Hello from Scarp!"
          project_parent="$(mktemp -d)"
          trap 'rm -rf "$project_parent"' EXIT
          compiler/target/release/scarp create -- "$project_parent/my project"
          compiler/target/release/scarp verify --diagnostic-format=json -- "$project_parent/my project"
          compiler/target/release/scarp inspect modules --json -- "$project_parent/my project" |
            node -e '
              const fs = require("node:fs");
              const graph = JSON.parse(fs.readFileSync(0, "utf8"));
              if (graph.schema_version !== 1 || !Array.isArray(graph.modules) ||
                  graph.modules.length < 1) {
                throw new Error("Scarp alpha.5 project inspection failed.");
              }
            '
          project_output="$(compiler/target/release/scarp launch -- "$project_parent/my project")"
          test "$project_output" = "Hello from Scarp!"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install --no-audit --no-fund
      - run: npm run check

      - name: Validate version and release tag
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUBLISHED_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VS Code extensions require numeric major.minor.patch versions." >&2
            exit 1
          fi
          tag="v$version"
          if [[ "$EVENT_NAME" == "release" && "$PUBLISHED_TAG" != "$tag" ]]; then
            echo "Refusing to publish: GitHub release tag $PUBLISHED_TAG does not match package version $tag." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "vsix=scarp-$version.vsix" >> "$GITHUB_OUTPUT"

      - name: Build verified pre-release package
        run: npm run package:pre

      - name: Check VSIX excludes internal repository metadata
        shell: bash
        run: |
          set -euo pipefail
          vsix="scarp-$(node -p "require('./package.json').version").vsix"
          test -f "$vsix"
          unzip -Z1 "$vsix" | grep -Fx 'extension/syntaxes/scarp.tmLanguage.json'
          unzip -Z1 "$vsix" | grep -Fx 'extension/dist/src/extension.js'
          unzip -Z1 "$vsix" | grep -Fx 'extension/language-configuration.json'
          if unzip -Z1 "$vsix" | grep -E '^extension/(release-requests|compiler|test|\.github|\.vscode|site|docs|src|scripts|node_modules)/|\.(ts|map)$|^extension/package-lock\.json

      - name: Ensure approved GitHub pre-release has the VSIX
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          TAG: ${{ steps.release.outputs.tag }}
          VSIX: ${{ steps.release.outputs.vsix }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if gh release view "$TAG" >/dev/null 2>&1; then
              if [[ "$(gh release view "$TAG" --json isPrerelease --jq '.isPrerelease')" != "true" ]]; then
                echo "Existing GitHub release $TAG is stable. Refusing to publish." >&2
                exit 1
              fi
            else
              notes=(--notes "Experimental Scarp compiler integration; native builds remain unsupported.")
              if [[ -f "docs/releases/$TAG.md" ]]; then
                notes=(--notes-file "docs/releases/$TAG.md")
              fi
              gh release create "$TAG" "$VSIX" \
                --target "$GITHUB_SHA" \
                --title "Scarp Compiler & Runner $TAG (pre-release)" \
                "${notes[@]}" \
                --prerelease
            fi
          fi

          # Use the exact asset attached to GitHub Release for both registries.
          if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fqx "$VSIX"; then
            mkdir -p release-package
            gh release download "$TAG" --pattern "$VSIX" --dir release-package
            cp "release-package/$VSIX" "$VSIX"
          else
            gh release upload "$TAG" "$VSIX"
          fi

      - name: Verify release VSIX identity and pre-release marker
        shell: bash
        env:
          VSIX: ${{ steps.release.outputs.vsix }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          unzip -p "$VSIX" extension/package.json | node -e '
            const fs = require("node:fs");
            const p = JSON.parse(fs.readFileSync(0, "utf8"));
            if (p.publisher !== "ScarpLang" || p.name !== "scarp" ||
                p.version !== process.env.VERSION) {
              console.error("VSIX publisher/name/version does not match this release.");
              process.exit(1);
            }
          '
          unzip -p "$VSIX" extension.vsixmanifest |
            grep -Fq 'Microsoft.VisualStudio.Code.PreRelease'

      - name: Verify Open VSX secret exists before publishing
        if: github.event_name == 'release' || inputs.publish_openvsx
        shell: bash
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [[ -z "${OVSX_PAT:-}" ]]; then
            echo "Add OVSX_PAT in Settings > Secrets and variables > Actions before publishing." >&2
            exit 1
          fi

      - name: Publish Visual Studio Marketplace pre-release (Trusted Publishing)
        if: github.event_name == 'release' || inputs.publish_marketplace
        env:
          VSIX: ${{ steps.release.outputs.vsix }}
        run: npx vsce publish --pre-release --packagePath "$VSIX" --oidc

      - name: Publish Open VSX pre-release (scoped token)
        if: github.event_name == 'release' || inputs.publish_openvsx
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          VSIX: ${{ steps.release.outputs.vsix }}
        run: npx --yes ovsx@1.3.0 publish "$VSIX"
; then
            echo "Refusing VSIX containing internal source, test or workflow files." >&2
            exit 1
          fi

      - name: Ensure approved GitHub pre-release has the VSIX
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          TAG: ${{ steps.release.outputs.tag }}
          VSIX: ${{ steps.release.outputs.vsix }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if gh release view "$TAG" >/dev/null 2>&1; then
              if [[ "$(gh release view "$TAG" --json isPrerelease --jq '.isPrerelease')" != "true" ]]; then
                echo "Existing GitHub release $TAG is stable. Refusing to publish." >&2
                exit 1
              fi
            else
              notes=(--notes "Experimental Scarp compiler integration; native builds remain unsupported.")
              if [[ -f "docs/releases/$TAG.md" ]]; then
                notes=(--notes-file "docs/releases/$TAG.md")
              fi
              gh release create "$TAG" "$VSIX" \
                --target "$GITHUB_SHA" \
                --title "Scarp Compiler & Runner $TAG (pre-release)" \
                "${notes[@]}" \
                --prerelease
            fi
          fi

          # Use the exact asset attached to GitHub Release for both registries.
          if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fqx "$VSIX"; then
            mkdir -p release-package
            gh release download "$TAG" --pattern "$VSIX" --dir release-package
            cp "release-package/$VSIX" "$VSIX"
          else
            gh release upload "$TAG" "$VSIX"
          fi

      - name: Verify release VSIX identity and pre-release marker
        shell: bash
        env:
          VSIX: ${{ steps.release.outputs.vsix }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          unzip -p "$VSIX" extension/package.json | node -e '
            const fs = require("node:fs");
            const p = JSON.parse(fs.readFileSync(0, "utf8"));
            if (p.publisher !== "ScarpLang" || p.name !== "scarp" ||
                p.version !== process.env.VERSION) {
              console.error("VSIX publisher/name/version does not match this release.");
              process.exit(1);
            }
          '
          unzip -p "$VSIX" extension.vsixmanifest |
            grep -Fq 'Microsoft.VisualStudio.Code.PreRelease'

      - name: Verify Open VSX secret exists before publishing
        if: github.event_name == 'release' || inputs.publish_openvsx
        shell: bash
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [[ -z "${OVSX_PAT:-}" ]]; then
            echo "Add OVSX_PAT in Settings > Secrets and variables > Actions before publishing." >&2
            exit 1
          fi

      - name: Publish Visual Studio Marketplace pre-release (Trusted Publishing)
        if: github.event_name == 'release' || inputs.publish_marketplace
        env:
          VSIX: ${{ steps.release.outputs.vsix }}
        run: npx vsce publish --pre-release --packagePath "$VSIX" --oidc

      - name: Publish Open VSX pre-release (scoped token)
        if: github.event_name == 'release' || inputs.publish_openvsx
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          VSIX: ${{ steps.release.outputs.vsix }}
        run: npx --yes ovsx@1.3.0 publish "$VSIX"
