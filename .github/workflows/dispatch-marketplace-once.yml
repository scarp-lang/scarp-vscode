# This temporary workflow is triggered only by the dedicated release PR merge.
# It delegates publication to the existing manual-only prerelease.yml workflow.
# Delete this workflow after the requested first Marketplace publication attempt.
name: Dispatch first Marketplace pre-release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dispatch-marketplace-once.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish-first-marketplace-pre]')
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch verified OIDC pre-release publisher
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh workflow run prerelease.yml --ref main --field publish_marketplace=true
          echo "Requested one Marketplace pre-release publication from the trusted workflow."
