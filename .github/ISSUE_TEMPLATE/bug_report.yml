name: Bug report
description: Report a reproducible Scarp VS Code extension bug
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Scarp compiler version
      description: Output of scarp --version, if available
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: VS Code version and operating system
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps and expected vs actual behavior
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Sanitized Scarp output
      description: Remove any secrets or private paths before posting
